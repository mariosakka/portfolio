name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly full-history secret scan
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Agent instruction files
        run: python scripts/check_agent_instructions.py .
      - name: Tracked scripts are executable
        run: |
          bad=$(git ls-files -s -- scripts .githooks | grep -v '^100755' || true)
          [ -z "$bad" ] || { echo "Not executable:"; echo "$bad"; exit 1; }
