name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly full-history secret scan
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Agent instruction files
        run: python scripts/check_agent_instructions.py .
      - name: Shebang scripts must be 100755
        run: |
          bad=$(git ls-files -s -- scripts .githooks | grep -v '^100755' | cut -f2 | while read -r f; do head -c2 "$f" | grep -q '^#!' && echo "$f"; done || true)
          [ -z "$bad" ] || { echo "Not executable:"; echo "$bad"; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Source/test sync guard
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'origin/main' }}
        run: node scripts/check-test-sync.ts "$BASE"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Placeholder check (non-blocking)
        run: node scripts/check-placeholders.ts
      - run: npm run build
